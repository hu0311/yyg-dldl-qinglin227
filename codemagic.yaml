workflows:
  build-ipa:
    name: Build unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      vars:
        APP_NAME: 斗罗大陆H5青春麒麟服
    scripts:
      - name: 编译并打包未签名 ipa
        script: |
          chmod +x scripts/build_ipa.sh
          ./scripts/build_ipa.sh
          ls -lh out/
    artifacts:
      - out/*.ipa
      - out/**/*.ipa
