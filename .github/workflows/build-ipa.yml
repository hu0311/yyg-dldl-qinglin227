name: build-ipa

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build unsigned ipa
        run: |
          chmod +x scripts/build_ipa.sh
          ./scripts/build_ipa.sh

      - name: List output
        run: ls -lh out || true

      - name: Upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: ipa-unsigned
          path: out/*.ipa
          if-no-files-found: error
          retention-days: 7
